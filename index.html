<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silky Lotus Music — Vital Spark</title>
<meta name="description" content="Vital Spark, the debut album from The Silky Lotus Jazz Orchestra. Listen and buy on Bandcamp, or find it on Spotify and Apple Music.">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Jost', system-ui, sans-serif;
    background: #0f1116;
  }
  a { text-decoration: none; }

  .page {
    width: 100%;
    min-height: 100vh;
    background-image: url('assets/background.png');
    background-size: cover;
    background-position: center bottom;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 24px 40px;
  }

  .cover {
    width: 100%;
    max-width: 440px;
    border-radius: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    display: block;
  }

  .links {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 44px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    border-radius: 8px;
    font-size: 16px;
    transition: all 0.15s ease;
  }

  .btn-primary {
    background: #c9a227;
    color: #14161c;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .btn-primary:hover { background: #d9b34f; }

  .btn-outline {
    background: transparent;
    border: 1px solid rgba(245,241,230,0.35);
    color: #f5f1e6;
    font-weight: 500;
    font-size: 15px;
    padding: 14px 24px;
  }
  .btn-outline:hover {
    border-color: rgba(245,241,230,0.7);
    background: rgba(245,241,230,0.06);
  }

  .spacer { flex-grow: 1; min-height: 56px; }

  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-top: 48px;
  }

  .footer img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    opacity: 0.9;
  }

  .footer .line {
    font-size: 18px;
    color: rgba(245,241,230,0.65);
    text-align: center;
    letter-spacing: 0.02em;
  }

  .footer a.line {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="page">

  <img class="cover" src="assets/vital-spark-cover.png" alt="Vital Spark — The Silky Lotus Jazz Orchestra">

  <div class="links">
    <a class="btn btn-primary" href="https://silkylotus.bandcamp.com/album/vital-spark" target="_blank" rel="noopener">Listen &amp; Buy on Bandcamp</a>
    <a class="btn btn-outline" href="https://distrokid.com/hyperfollow/thesilkylotusjazzorchestra/vital-spark" target="_blank" rel="noopener">Pre-save on Spotify</a>
    <a class="btn btn-outline" href="https://distrokid.com/hyperfollow/thesilkylotusjazzorchestra/vital-spark" target="_blank" rel="noopener">Pre-add on Apple Music</a>
  </div>

  <div class="spacer"></div>

  <div class="footer">
    <img src="assets/free-rein-logo.png" alt="Free Rein Studios">
    <div class="line">&copy; 2026 Silky Lotus Music &middot; All rights reserved</div>
    <a class="line" href="mailto:steve4dd@gmail.com">Steven Dieckbrader &mdash; steve4dd@gmail.com</a>
  </div>

</div>
</body>
</html>
